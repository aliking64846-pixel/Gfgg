<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>الصفحة غير موجودة — مستقبلي 100</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b1220;color:#f4f7ff}
    main{width:min(100%,480px);padding:28px;border:1px solid #26354d;border-radius:22px;background:#111c2e;text-align:center;box-shadow:0 18px 60px #0005}
    .code{font-size:52px;font-weight:800;color:#60a5fa;line-height:1}
    h1{font-size:24px;margin:18px 0 10px}
    p{line-height:1.8;color:#c4cede}
    a{display:inline-block;margin-top:10px;padding:12px 20px;border-radius:12px;background:#2563eb;color:white;text-decoration:none;font-weight:700}
    a:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>هاي الصفحة مو موجودة</h1>
    <p>يمكن الرابط خطأ أو الصفحة انتقلت. تگدر ترجع إلى الصفحة الرئيسية وتكمل دراستك.</p>
    <a href="./">الرجوع إلى مستقبلي 100</a>
  </main>
</body>
</html>
