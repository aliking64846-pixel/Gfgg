<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>مراسلة مشفّرة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #0f172a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
    }
    button {
      background: #22c55e;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    #chat {
      display: none;
    }
    #messages {
      background: #020617;
      height: 200px;
      overflow-y: auto;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="box" id="login">
  <h2>دخول سريع</h2>
  <input id="name" placeholder="اسمك">
  <input id="room" placeholder="رمز الغرفة">
  <button onclick="start()">دخول</button>
</div>

<div class="box" id="chat">
  <h2 id="roomTitle"></h2>
  <div id="messages"></div>
  <input id="msg" placeholder="اكتب رسالة">
  <button onclick="send()">إرسال مشفّر</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let room = "";
  let name = "";

  function encrypt(text) {
    return btoa(unescape(encodeURIComponent(text)));
  }

  function decrypt(text) {
    return decodeURIComponent(escape(atob(text)));
  }

  function start() {
    name = nameInput.value;
    room = roomInput.value;
    if (!name || !room) return alert("اكتب الاسم ورمز الغرفة");

    login.style.display = "none";
    chat.style.display = "block";
    roomTitle.innerText = "غرفة: " + room;

    socket.emit("join", { name, room });
  }

  socket.on("msg", data => {
    const div = document.createElement("div");
    div.innerText = data.name + ": " + decrypt(data.text);
    messages.appendChild(div);
  });

  function send() {
    const text = msg.value;
    if (!text) return;
    socket.emit("msg", { room, name, text: encrypt(text) });
    msg.value = "";
  }
</script>

</body>
</html>
